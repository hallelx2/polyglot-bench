<meta charset="utf-8">
<title>Polyglot Bench — live dashboard replay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
:root{
  --obsidian:#09090b; --graphite:#18181b; --iron:#3f3f46; --steel:#52525b;
  --fog:#71717a; --ash:#a1a1aa; --mist:#d4d4d8; --cloud:#ececee;
  --paper:#f4f4f5; --snow:#ffffff; --ember:#ff5a00;
}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:1080px;background:var(--paper);overflow:hidden;
  font-family:"DM Sans",system-ui,sans-serif;color:var(--graphite);
  -webkit-font-smoothing:antialiased;padding:26px 30px;
  display:grid;grid-template-rows:auto 1.02fr 1fr;gap:16px}
.bar{display:flex;align-items:center;gap:26px}
.bar .t{font-size:20px;font-weight:600;color:var(--obsidian)}
.bar .t em{font-style:normal;font-weight:400;color:var(--fog);margin-left:12px;font-size:17px}
.bar .clock{margin-left:auto;font-size:19px;color:var(--iron);
  font-variant-numeric:tabular-nums}
.bar .clock b{font-size:26px;color:var(--obsidian);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:7px;font-size:15px;color:var(--steel)}
.legend i{width:16px;height:4px;border-radius:2px;display:block}
.row{display:grid;gap:18px}
.r1{grid-template-columns:2.1fr 1fr}
.r2{grid-template-columns:1fr 1fr 1fr}
.card{background:var(--snow);border:1px solid var(--cloud);border-radius:22px;
  padding:18px 20px 12px;display:flex;flex-direction:column;min-width:0}
.card h3{font-size:17px;font-weight:600;color:var(--obsidian)}
.card h3 em{font-style:normal;font-size:14px;font-weight:400;color:var(--fog);
  margin-left:10px}
.card canvas{flex:1;width:100%;min-height:0}
</style>

<div class="bar">
  <div class="t">quote endpoint<em>64 connections, flat out — replay of one measured window</em></div>
  <div class="legend" id="legend"></div>
  <div class="clock">t = <b id="clock">0.0</b> s</div>
</div>

<div class="row r1">
  <div class="card"><h3>Throughput<em>requests / second</em></h3><canvas id="c_rps"></canvas></div>
  <div class="card"><h3>SQL statements<em>per second, 6.55 per call</em></h3><canvas id="c_sql"></canvas></div>
</div>

<div class="row r2">
  <div class="card"><h3>Median latency<em>p50, ms</em></h3><canvas id="c_p50"></canvas></div>
  <div class="card"><h3>Tail latency<em>p99, ms</em></h3><canvas id="c_p99"></canvas></div>
  <div class="card"><h3>CPU per request<em>ms, median over the window</em></h3><canvas id="c_cpu"></canvas></div>
</div>

<script>
const D = window.__DATA__, S = D.stacks;
const LANG = {Rust:"#27272a", Go:"#71717a", TypeScript:"#a1a1aa"};
const HERO = "ts-bun-only";
const col = s => s.id === HERO ? "#ff5a00" : LANG[s.lang];
const SHORT = {"rust-hyper":"Rust hyper","rust-axum":"Rust Axum","rust-actix":"Rust Actix",
  "go-nethttp":"Go net/http","go-fiber":"Go Fiber","go-gin":"Go Gin","go-gin-gorm":"Go Gin+GORM",
  "ts-bun-only":"TS Bun only","ts-bun-hono":"TS Hono","ts-node-fastify":"TS Fastify"};
const fmt = (v,d=0) => v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

legend.innerHTML = S.map(s=>
  `<span><i style="background:${col(s)}"></i>${SHORT[s.id]}</span>`).join("");

const T_END = Math.max(...S.map(s=>s.series.at(-1).t));   // last measured second
const DURATION = 30;                                       // seconds of video
const DPR = 2;

function setup(cv){
  const r = cv.getBoundingClientRect();
  cv.width = r.width*DPR; cv.height = r.height*DPR;
  const ctx = cv.getContext("2d"); ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,r.width,r.height);
  return {ctx, w:r.width, h:r.height};
}

/** value of a stack's series at a fractional time, linearly interpolated */
function at(s, key, t){
  const i = clamp(Math.floor(t), 0, s.series.length-1);
  const j = clamp(i+1, 0, s.series.length-1);
  const f = clamp(t-i, 0, 1);
  return s.series[i][key]*(1-f) + s.series[j][key]*f;
}

function niceMax(v){
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  return Math.ceil(v/p*2)/2*p;
}

function lineChart(cv, key, t, {unit="", dec=0, scale=1}={}){
  const {ctx,w,h} = setup(cv);
  const L=62, R=78, T=14, B=26;
  const top = niceMax(Math.max(...S.flatMap(s=>s.series.map(b=>b[key]*scale)))*1.06);
  const X = u => L + u/T_END*(w-L-R);
  const Y = v => h-B - v/top*(h-B-T);

  ctx.strokeStyle="#ececee"; ctx.lineWidth=1; ctx.fillStyle="#71717a";
  ctx.font="12px 'DM Sans'"; ctx.textAlign="right"; ctx.textBaseline="middle";
  for(let g=0; g<=4; g++){
    const v = top*g/4;
    ctx.beginPath(); ctx.moveTo(L,Y(v)); ctx.lineTo(w-R,Y(v)); ctx.stroke();
    ctx.fillText(fmt(v,dec), L-8, Y(v));
  }
  ctx.textAlign="center"; ctx.textBaseline="top";
  for(let u=0; u<=T_END; u+=2){
    ctx.fillText(u+"s", X(u), h-B+7);
  }

  // the moving "now" line
  ctx.strokeStyle="#d4d4d8"; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(X(t),T); ctx.lineTo(X(t),h-B); ctx.stroke();
  ctx.setLineDash([]);

  const labels=[];
  for(const s of S){
    const c = col(s), hero = s.id===HERO;
    ctx.strokeStyle=c; ctx.lineWidth = hero?3:1.8; ctx.globalAlpha = hero?1:.9;
    ctx.beginPath();
    for(let u=0; u<=t+1e-9; u+=0.05){
      const uu = Math.min(u,t), v = at(s,key,uu)*scale;
      uu===0 ? ctx.moveTo(X(uu),Y(v)) : ctx.lineTo(X(uu),Y(v));
    }
    ctx.stroke();
    // head dot + live value
    const v = at(s,key,t)*scale;
    ctx.fillStyle=c; ctx.beginPath(); ctx.arc(X(t),Y(v), hero?4.5:3.2, 0, 6.2832); ctx.fill();
    ctx.globalAlpha=1;
    labels.push({y:Y(v), text:fmt(v,dec)+unit, c, hero});
  }
  // keep the right-hand readouts from overprinting each other
  labels.sort((a,b)=>a.y-b.y);
  for(let i=1;i<labels.length;i++)
    if(labels[i].y-labels[i-1].y < 15) labels[i].y = labels[i-1].y+15;
  const over = labels.length ? labels.at(-1).y-(h-B) : 0;
  if(over>0){ for(const l of labels) l.y-=over;
    for(let i=labels.length-2;i>=0;i--)
      if(labels[i+1].y-labels[i].y < 15) labels[i].y = labels[i+1].y-15; }
  ctx.textAlign="left"; ctx.textBaseline="middle";
  for(const l of labels){
    ctx.fillStyle=l.c; ctx.font=(l.hero?"600 ":"")+"13px 'DM Sans'";
    ctx.fillText(l.text, w-R+8, l.y);
  }
}

/** horizontal bars that fill once, then hold — a per-run median, not a series */
function barChart(cv, key, t, {dec=3}={}){
  const {ctx,w,h} = setup(cv);
  const L=112, R=58, T=6, B=6;
  const rows=[...S].sort((a,b)=>a[key]-b[key]);
  const top = niceMax(Math.max(...rows.map(s=>s[key])));
  const gap = (h-T-B)/rows.length;
  const grow = clamp(t/ (T_END*0.55), 0, 1);
  ctx.font="13px 'DM Sans'";
  rows.forEach((s,i)=>{
    const y = T + i*gap + gap/2, bh = Math.min(17, gap-6);
    ctx.fillStyle="#3f3f46"; ctx.textAlign="right"; ctx.textBaseline="middle";
    ctx.font = (s.id===HERO?"600 ":"")+"13px 'DM Sans'";
    ctx.fillText(SHORT[s.id], L-10, y);
    ctx.fillStyle="#f4f4f5";
    ctx.beginPath(); ctx.roundRect(L, y-bh/2, w-L-R, bh, 5); ctx.fill();
    ctx.fillStyle=col(s);
    ctx.beginPath(); ctx.roundRect(L, y-bh/2, Math.max(2,(w-L-R)*s[key]/top*grow), bh, 5); ctx.fill();
    ctx.fillStyle="#3f3f46"; ctx.textAlign="left";
    ctx.fillText(fmt(s[key],dec), w-R+8, y);
  });
}

function renderAt(vt){
  const t = clamp(vt/DURATION, 0, 1) * T_END;
  clock.textContent = t.toFixed(1);
  lineChart(c_rps, "rps", t, {dec:0});
  lineChart(c_sql, "rps", t, {dec:0, scale:D.sqlPerCall});
  lineChart(c_p50, "p50", t, {dec:1});
  lineChart(c_p99, "p99", t, {dec:1});
  barChart (c_cpu, "cpu", t, {dec:3});
}
window.renderAt = renderAt;
window.DURATION = DURATION;
renderAt(0);
</script>
